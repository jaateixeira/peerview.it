{# Settings shared by the create and edit forms. Optional `r` is the round being edited. #}
<label class="field">Reviews each submission gets
  <input type="number" name="per_submission" min="1" max="20" value="{{ r.per_submission if r else 2 }}" required>
</label>
<label class="field">Allocation
  <select name="strategy">
    {% for s in strategies %}<option value="{{ s.key }}" {% if r and r.strategy_key == s.key %}selected{% endif %}>{{ s.label }}</option>{% endfor %}
  </select>
</label>
<label class="field">Identities
  <select name="anonymity">
    {% for key, label in anonymity_options %}<option value="{{ key }}" {% if (r.anonymity_key if r else default_anonymity) == key %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</label>
<label class="field">Opens <small>(optional)</small> <input type="datetime-local" name="opens_at" value="{{ r.opens_at|local_input if r else '' }}"></label>
{% set due = r.closes_at if r else None %}
<div class="field-pair">
  <label class="field">Reviews due <small>(optional; the round closes then)</small>
    <input type="date" name="closes_on" data-min-today min="{{ min_day(due) }}" value="{{ due|day }}"></label>
  <label class="field">at <input type="time" name="closes_time" value="{{ due|time_of }}"></label>
</div>
<p class="hint">Times are in {{ your_zone() }} time. Reviews are due at 16:00 unless you choose another time.
  Join a paid plan to choose when peerview.it sends reminders.</p>
